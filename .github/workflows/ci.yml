name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest httpx
      - run: pytest -q

  eval:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small
      - run: pip install -r requirements.txt
      - name: Download datasheets and build both indexes
        run: python -m semirag.sources && python -m semirag.search build
      - name: Chunking eval
        run: python eval/run_eval.py
      - if: always()
        run: test -f EVAL.md && cat EVAL.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: eval-results
          path: |
            EVAL.md
            eval/results.json
