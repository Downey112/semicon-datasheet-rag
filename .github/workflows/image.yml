name: Container image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/downey112/semicon-datasheet-rag:latest
            ghcr.io/downey112/semicon-datasheet-rag:${{ github.sha }}
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8000:8000 ghcr.io/downey112/semicon-datasheet-rag:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf localhost:8000/v1/health && break; sleep 2; done
          curl -sf -X POST localhost:8000/v1/search -H "Content-Type: application/json" \
               -d '{"question": "TCA9548A I2C address with A0 A1 A2 low", "k": 1}'
